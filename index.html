<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowtalkia | Próximamente</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111827; /* Tu azul marino oscuro */
            color: #ffffff;
            font-family: 'Manrope', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1rem;
        }
        .gradient-text {
            background: linear-gradient(90deg, #3563F5, #8055E8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #9CA3AF;
            font-weight: 400;
            max-width: 600px;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .icon {
            width: 360px;
            max-width: 100%; /* Para que no se desborde en móviles pequeños */
            height: auto;
            margin-bottom: 2rem;
            /* Aquí puedes añadir un filtro para simular el neón si usas el icono sólido */
            filter: drop-shadow(0 0 15px rgba(128, 85, 232, 0.4));
        }
        .button {
            background: linear-gradient(90deg, #3563F5, #8055E8);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.3s ease;
        }
        /* ESTILOS DEL FOOTER */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;             /* <-- AÑADE ESTO */
            justify-content: center;   /* <-- AÑADE ESTO para centrar el bloque */
            font-size: 0.8rem;
            color: #6B7280;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .footer-copy {
            margin: 0;
            max-width: 100%; /* <-- AÑADE ESTO para anular el límite de 600px de los párrafos */
        }
    </style>
</head>
<body>

    <!-- PON AQUÍ TU ICONO: Cambia "logo.png" por el nombre de tu archivo de imagen -->
    <img src="images/logofti.png" alt="Flowtalkia Icon" class="icon">

    <div class="logo">
        Flow<span class="gradient-text">talk</span>ia
    </div>
    
    <p>Próximamente. Automatización e IA para tu negocio. Estamos preparando algo increíble para hacer fluir tus procesos.</p>
    
    <!-- Puedes cambiar el enlace por tu LinkedIn o tu correo -->
    <a href="mailto:hola@flowtalkia.com" class="button">Contáctanos</a>
    <!-- FOOTER -->
    <footer class="footer">
        <p class="footer-copy">
            © <span id="year"></span> Flowtalkia. Todos los derechos reservados.
        </p>
    </footer>

    <!-- SCRIPT PARA EL AÑO AUTOMÁTICO -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
